version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
